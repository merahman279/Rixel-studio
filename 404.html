<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Rixel Studio</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#051424",
            "surface-container": "#122131",
            "surface-container-high": "#1c2b3c",
            "primary": "#b4c5ff",
            "primary-container": "#2563eb",
            "tertiary": "#2fd9f4",
            "on-surface": "#d4e4fa",
            "on-surface-variant": "#c3c6d7"
          },
          fontFamily: {
            "sora": ["Sora", "sans-serif"],
            "inter": ["Inter", "sans-serif"],
            "space": ["Space Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 text-center antialiased relative overflow-hidden">
  
  <!-- Ambient background glow -->
  <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-container/20 rounded-full blur-[120px]"></div>
  <div class="pointer-events-none absolute bottom-0 left-1/3 w-80 h-80 bg-tertiary/15 rounded-full blur-[100px]"></div>

  <div class="relative z-10 max-w-md flex flex-col items-center gap-6 p-8 sm:p-10 rounded-3xl bg-surface-container/80 border border-white/10 backdrop-blur-xl shadow-2xl">
    <div class="relative w-16 h-16 rounded-full overflow-hidden p-0.5 bg-gradient-to-tr from-primary-container via-tertiary to-primary shadow-[0_0_20px_rgba(47,217,244,0.35)]">
      <img src="logo.png" onerror="this.src='200 by 200.png'" alt="Rixel Studio" class="w-full h-full object-contain rounded-full bg-black">
    </div>

    <div class="flex flex-col gap-2">
      <span class="font-space text-5xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-primary via-tertiary to-secondary">404</span>
      <h1 class="font-sora text-xl sm:text-2xl font-bold text-white">Page Not Found</h1>
      <p class="font-inter text-sm text-on-surface-variant">
        The page you are looking for does not exist or has been moved.
      </p>
    </div>

    <a href="index.html" class="inline-flex items-center justify-center gap-2 px-8 py-3 rounded-full font-space text-sm font-semibold text-white bg-gradient-to-r from-primary-container to-secondary-container shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:scale-105 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[18px]">home</span>
      <span>Back to Homepage</span>
    </a>
  </div>

  <footer class="absolute bottom-6 text-xs font-inter text-on-surface-variant/60">
    © 2025 Rixel Studio. All rights reserved.
  </footer>
</body>
</html>
