<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rixel Studio Admin</title>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      var isFile = window.location.protocol === 'file:';
      var root = isFile ? '../' : '/';
      var path = window.location.pathname;
      var adminIdx = path.indexOf('/admin');
      if (!isFile && adminIdx > 0) {
        root = path.substring(0, adminIdx + 1);
      }
      document.write('<script src="' + root + 'env.js" onerror="/* optional */"><\/script>');
      document.write('<script src="' + root + 'supabase-client.js"><\/script>');
    })();
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      let user = null;
      if (window.RixelSupabase) {
        user = await window.RixelSupabase.getUser();
      }
      var isFile = window.location.protocol === 'file:';
      var target = user ? 'dashboard' : 'login';
      if (isFile) {
        window.location.replace(target + '/index.html');
      } else {
        var adminIdx = window.location.pathname.indexOf('/admin');
        var prefix = adminIdx > 0 ? window.location.pathname.substring(0, adminIdx) : '';
        window.location.replace(prefix + '/admin/' + target);
      }
    });
  </script>
</head>
<body style="background:#051424;color:#d4e4fa;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
  <p>Routing to Rixel Studio Admin...</p>
</body>
</html>
